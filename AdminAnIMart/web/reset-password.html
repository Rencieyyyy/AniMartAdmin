<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AniMart</title>
  <link rel="icon" type="image/png" href="assets/animart.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Matches the login page's design system (index.html). */
    :root {
      --primary: #91E6C1;
      --dark: #1F2937;
      --white: #FFFFFF;
      --gray-muted: #6B7280;
      --bg-dirty: #F3F4F6;
      --danger: #DC2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dirty);
      color: var(--dark);
      min-height: 100vh; margin: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 0;
    }

    .card {
      background: var(--white);
      width: 90%; max-width: 460px;
      border-radius: 28px;
      padding: 44px 42px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
        0 25px 50px -12px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .brand-logo { width: 130px; height: auto; margin: 0 auto 20px; display: block; }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    .sub { color: var(--gray-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 24px; }

    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; }
    .input-group input {
      width: 100%; padding: 13px 16px;
      border: 2px solid var(--primary); border-radius: 12px;
      font-size: 1rem; font-family: inherit; color: var(--dark);
      transition: all 0.2s;
    }
    .input-group input:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(145, 230, 193, 0.2);
    }
    .input-group input#otpCode {
      letter-spacing: 8px; font-weight: 700; text-align: center; font-size: 1.2rem;
    }

    .hint { font-size: 0.78rem; color: var(--gray-muted); margin-top: 8px; min-height: 1em; }
    .hint.err { color: var(--danger); font-weight: 600; }
    .hint.ok { color: #059669; font-weight: 600; }

    .btn-submit {
      width: 100%; padding: 15px; margin-top: 8px;
      background-color: var(--primary); color: var(--dark);
      border: none; border-radius: 12px;
      font-weight: 700; font-size: 1rem; font-family: inherit; cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px 0 rgba(145, 230, 193, 0.39);
    }
    .btn-submit:hover { background-color: #7ed9b0; transform: translateY(-2px); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .btn-link {
      background: none; border: none; cursor: pointer;
      color: var(--dark); font-weight: 600; font-size: 0.85rem; font-family: inherit;
      margin-top: 16px; text-decoration: none;
    }
    .btn-link:hover { text-decoration: underline; }
    .btn-link:disabled { color: var(--gray-muted); cursor: not-allowed; text-decoration: none; }

    .state-icon {
      width: 56px; height: 56px; border-radius: 50%;
      font-size: 1.9rem; font-weight: 800; line-height: 56px;
      margin: 0 auto 18px;
    }
    .state-icon.ok { background: #D1FAE5; color: #059669; }

    .back-link {
      display: inline-block; margin-top: 18px;
      color: var(--dark); font-weight: 600; font-size: 0.875rem; text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <div class="card">
    <img src="assets/animart.png" alt="AniMart Logo" class="brand-logo">

    <!-- Enter code + new password -->
    <div id="stateForm">
      <h1>Reset your password</h1>
      <p class="sub">Enter the 6-digit code from the reset email we sent you, then choose a new password.</p>

      <form id="resetForm">
        <div class="input-group" id="emailGroup">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="input-group" id="codeGroup">
          <label for="otpCode">6-digit code</label>
          <input id="otpCode" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" required>
        </div>

        <div class="input-group">
          <label for="newPwd">New password</label>
          <input id="newPwd" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <div class="input-group">
          <label for="confirmPwd">Confirm new password</label>
          <input id="confirmPwd" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>

        <div class="hint" id="formHint"></div>
        <button type="submit" id="saveBtn" class="btn-submit">Save new password</button>
      </form>

      <button type="button" class="btn-link" id="resendBtn">Didn't get a code? Send a new one</button>
      <br>
      <a class="back-link" href="index.html">← Back to sign in</a>
    </div>

    <!-- Success -->
    <div id="stateDone" hidden>
      <div class="state-icon ok">✓</div>
      <h1>Password updated</h1>
      <p class="sub">Your password has been changed. Sign in with your new password to continue.</p>
      <a class="back-link" href="index.html">← Back to sign in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Standalone client on purpose: config.js's protected-page guard would
    // sign out / redirect mid-recovery.
    //
    // Flow: the project's recovery email delivers a 6-DIGIT CODE (the mobile
    // app uses the same template), so this page verifies it with
    // auth.verifyOtp({ type:'recovery' }) and then sets the new password.
    // If the email template is ever switched back to a link, the link's
    // #access_token fragment is also handled (detectSessionInUrl) and the
    // email/code fields hide themselves.
    const SUPABASE_URL = "https://kzhlhrhhfupgvpzjllce.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6aGxocmhoZnVwZ3ZwempsbGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyOTg5MzcsImV4cCI6MjA5Njg3NDkzN30.asNT0AIXPO_cXKDK_YLV9wozWnCHlg9Bb1L8pMNAPxM";
    const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let recoverySession = false;   // true when a link-style token signed us in

    const hint = document.getElementById("formHint");
    function setHint(msg, cls) { hint.textContent = msg || ""; hint.className = "hint " + (cls || ""); }

    // Prefill the email from ?email=… (the login page passes it along).
    const qsEmail = new URLSearchParams(window.location.search).get("email");
    if (qsEmail) document.getElementById("email").value = qsEmail;

    // Link-style recovery (fallback): token arrives in the hash and
    // supabase-js turns it into a session — no code entry needed then.
    supa.auth.onAuthStateChange((event, session) => {
      if ((event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") && session) {
        recoverySession = true;
        document.getElementById("emailGroup").hidden = true;
        document.getElementById("codeGroup").hidden = true;
        document.getElementById("email").required = false;
        document.getElementById("otpCode").required = false;
        setHint("Reset link verified — just choose your new password.", "ok");
      }
    });

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      setHint("");

      const pwd = document.getElementById("newPwd").value;
      const confirm = document.getElementById("confirmPwd").value;
      if (pwd.length < 8) { setHint("Password must be at least 8 characters.", "err"); return; }
      if (pwd !== confirm) { setHint("Passwords do not match.", "err"); return; }

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.innerText = "Saving…";

      try {
        if (!recoverySession) {
          const email = document.getElementById("email").value.trim();
          const code = document.getElementById("otpCode").value.trim();
          if (!email) throw new Error("Enter your email address.");
          if (!/^\d{6}$/.test(code)) throw new Error("Enter the 6-digit code from the email.");

          const { error: otpErr } = await supa.auth.verifyOtp({
            email, token: code, type: "recovery"
          });
          if (otpErr) {
            throw new Error(
              otpErr.message && /expired|invalid/i.test(otpErr.message)
                ? "That code is invalid or has expired — request a new one below."
                : (otpErr.message || "Could not verify the code.")
            );
          }
        }

        const { error: updErr } = await supa.auth.updateUser({ password: pwd });
        if (updErr) throw new Error(updErr.message || "Could not update the password.");

        // Force a fresh sign-in with the new password (also clears the
        // recovery session from this browser).
        await supa.auth.signOut();
        document.getElementById("stateForm").hidden = true;
        document.getElementById("stateDone").hidden = false;
      } catch (err) {
        setHint(err.message || String(err), "err");
        btn.disabled = false;
        btn.innerText = "Save new password";
      }
    });

    // Resend: same call the login page makes; same neutral wording so the
    // page can't be used to probe which emails are registered.
    document.getElementById("resendBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) { setHint("Enter your email address first, then resend.", "err"); return; }

      const btn = document.getElementById("resendBtn");
      btn.disabled = true;
      const { error } = await supa.auth.resetPasswordForEmail(email);
      btn.disabled = false;

      if (error && error.status === 429) {
        setHint("Too many requests — wait a minute before resending.", "err");
        return;
      }
      setHint("If an account exists for that email, a new code is on its way.", "ok");
    });
  </script>
</body>

</html>
