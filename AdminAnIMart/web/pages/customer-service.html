<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service | AniMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.321.0/dist/umd/lucide.min.js"></script>

    <style>
        :root {
            --mint: #7EFFC5;
            --mint-dim: #5CE8A8;
            --mint-glow: rgba(126, 255, 197, 0.15);
            --dark: #0D1117;
            --surface: #161B22;
            --surface-2: #1C2333;
            --border: rgba(255,255,255,0.07);
            --text: #E6EDF3;
            --muted: #7D8590;
            --danger: #FF6B6B;
            --sidebar-w: 260px;
            --radius: 16px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sora', sans-serif;
            background-color: white;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(126,255,197,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .wrapper { display: flex; min-height: 100vh; position: relative; z-index: 1; }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            padding: 0 12px 20px;
        }

        .sidebar-brand {
            padding: 28px 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .brand-icon {
            width: 36px; height: 36px;
            background: var(--mint);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .brand-icon svg { width: 18px; height: 18px; color: var(--dark); }

        .brand-name { font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: -0.03em; }
        .brand-name span { color: var(--mint); }

        .nav { display: flex; flex-direction: column; flex: 1; gap: 3px; }

        .nav-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 14px 12px 6px;
        }

        .nav-link {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px;
            text-decoration: none; color: var(--muted);
            font-size: 0.875rem; font-weight: 500;
            transition: all 0.18s ease;
            border: none; background: transparent; cursor: pointer;
            width: 100%; text-align: left;
        }

        .nav-link svg { width: 16px; height: 16px; flex-shrink: 0; transition: color 0.18s; }
        .nav-link:hover { color: var(--text); background: var(--mint); }
        .nav-link.active { background: var(--mint); color: var(--dark); font-weight: 700; }
        .nav-link.active svg { color: var(--dark); }
        .nav-link.logout { color: var(--danger); margin-top: auto; }
        .nav-link.logout:hover { background: rgba(255,107,107,0.1); color: var(--danger); }

        .nav-bottom {
            border-top: 1px solid var(--border);
            padding-top: 12px; margin-top: auto;
            display: flex; flex-direction: column; gap: 3px;
        }

        /* MAIN */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* TOP BAR */
        .topbar {
            padding: 24px 32px 20px;
            border-bottom: 1px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--mint);
            flex: 1;
        }

        .topbar p { font-size: 0.8rem; color: var(--muted); }

        .topbar-stats {
            display: flex;
            gap: 12px;
        }

        .topbar-stat {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 16px;
            text-align: center;
        }

        .topbar-stat-val {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
            font-family: 'DM Mono', monospace;
        }

        .topbar-stat-label {
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* LAYOUT */
        .cs-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            flex: 1;
            overflow: hidden;
        }

        /* CONVERSATION LIST */
        .conv-list {
            border-right: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .conv-search {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .conv-search input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px 8px 36px;
            font-size: 0.8rem;
            color: var(--text);
            font-family: 'Sora', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            position: relative;
        }

        .conv-search input:focus { border-color: rgba(126,255,197,0.3); }
        .conv-search input::placeholder { color: var(--muted); }

        .conv-search-wrap {
            position: relative;
        }

        .conv-search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px; height: 14px;
            color: var(--muted);
            pointer-events: none;
        }

        .conv-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 8px;
            flex-shrink: 0;
        }

        .conv-tab {
            flex: 1;
            padding: 10px 6px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            text-align: center;
            white-space: nowrap;        /* keep "On-going" on one line */
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.18s;
        }

        .conv-tab.active { color: var(--mint); border-bottom-color: var(--mint); }

        .conv-items {
            overflow-y: auto;
            flex: 1;
        }

        .conv-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .conv-item:hover { background: var(--surface-2); }
        .conv-item.active { background: var(--surface-2); border-left: 2px solid var(--mint); }

        .conv-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700;
            color: var(--mint);
            flex-shrink: 0;
            position: relative;     /* anchors the photo overlay */
            overflow: hidden;
        }

        /* Profile photo that covers the initials; removes itself on load error,
           revealing the initials underneath. Used in the list, header and chat. */
        .av-img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .conv-meta { flex: 1; min-width: 0; }

        .conv-name {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .conv-time {
            font-size: 0.65rem;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            flex-shrink: 0;
        }

        .conv-preview {
            font-size: 0.73rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }

        .conv-unread {
            width: 18px; height: 18px;
            background: var(--mint);
            color: var(--dark);
            border-radius: 50%;
            font-size: 0.6rem;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .priority-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 6px;
        }

        /* CHAT PANEL */
        .chat-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0D1117;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-header-info { flex: 1; }

        .chat-header-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 7px; height: 7px;
            background: var(--mint);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--mint);
        }

        .chat-header-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

        .chat-header-actions { display: flex; gap: 8px; }

        .icon-btn {
            width: 34px; height: 34px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.18s;
        }

        .icon-btn:hover { border-color: rgba(126,255,197,0.3); color: var(--mint); }
        .icon-btn svg { width: 14px; height: 14px; }

        /* MESSAGES */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .msg-row.admin { flex-direction: row-reverse; }

        .msg-avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; font-weight: 700;
            flex-shrink: 0;
            margin-bottom: 2px;
            position: relative;
            overflow: hidden;
        }

        .msg-avatar.user-av { background: var(--surface-2); border: 1px solid var(--border); color: var(--mint); }
        .msg-avatar.admin-av { background: var(--mint); color: var(--dark); }

        /* Wrapper around bubble + timestamp: caps how wide a message can get,
           and aligns the column to the correct side. min-width:0 lets long words
           wrap instead of forcing the column wider. */
        .msg-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 65%;
            min-width: 0;
        }

        .msg-row.admin .msg-content { align-items: flex-end; }

        .msg-bubble {
            width: fit-content;          /* hug the text … */
            max-width: 100%;             /* … until it hits the column cap, then wrap */
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.82rem;
            line-height: 1.55;
            position: relative;
            white-space: pre-wrap;       /* keep the user's line breaks */
            word-break: break-word;
            overflow-wrap: anywhere;     /* break very long unbroken strings/URLs */
        }

        .msg-row:not(.admin) .msg-bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .msg-row.admin .msg-bubble {
            background: var(--mint);
            color: var(--dark);
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 0.62rem;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            margin-top: 3px;
            padding: 0 4px;
        }

        .msg-row.admin .msg-time { text-align: right; }

        .date-divider {
            text-align: center;
            font-size: 0.68rem;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-divider::before, .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* CHAT INPUT */
        .chat-input-wrap {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .quick-replies {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .quick-replies::-webkit-scrollbar { height: 3px; }

        .quick-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.7rem;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Sora', sans-serif;
            transition: all 0.18s;
            flex-shrink: 0;
        }

        .quick-btn:hover { border-color: rgba(126,255,197,0.3); color: var(--mint); }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-textarea {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: var(--text);
            font-family: 'Sora', sans-serif;
            outline: none;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        .chat-textarea:focus { border-color: rgba(126,255,197,0.35); }
        .chat-textarea::placeholder { color: var(--muted); }

        .send-btn {
            width: 44px; height: 44px;
            background: var(--mint);
            border: none;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--dark);
            transition: all 0.18s;
            flex-shrink: 0;
        }

        .send-btn:hover { background: var(--mint-dim); transform: scale(1.05); }
        .send-btn svg { width: 16px; height: 16px; }

        /* STATUS TAGS */
        .tag {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.62rem; font-weight: 600;
            padding: 2px 7px; border-radius: 20px;
            font-family: 'DM Mono', monospace;
        }

        .tag-open { background: rgba(126,255,197,0.12); color: var(--mint-dim); border: 1px solid rgba(126,255,197,0.2); }
        .tag-pending { background: rgba(251,191,36,0.12); color: #FBB824; border: 1px solid rgba(251,191,36,0.2); }
        .tag-closed { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border); }
        .tag-urgent { background: rgba(255,107,107,0.12); color: var(--danger); border: 1px solid rgba(255,107,107,0.2); }

        /* EMPTY STATE */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--muted);
        }

        .empty-chat svg { width: 48px; height: 48px; opacity: 0.3; }
        .empty-chat p { font-size: 0.85rem; }

        /* ANIMATIONS */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* SCROLLBARS */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            :root { --sidebar-w: 64px; }
            .sidebar-brand, .nav-link span, .nav-label { display: none; }
            .nav-link { justify-content: center; padding: 10px; }
            .cs-layout { grid-template-columns: 240px 1fr; }
        }

        @media (max-width: 700px) {
            .cs-layout { grid-template-columns: 1fr; }
            .conv-list { display: none; }
            .topbar-stats { display: none; }
        }
    </style>
</head>
<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </div>
            <div class="brand-name">Ani<span>Mart</span></div>
        </div>

        <nav class="nav">
            <div class="nav-label">Main</div>
            <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
            <a href="sellers.html" class="nav-link"><i data-lucide="store"></i><span>Sellers & Buyers</span></a>
            <a href="premium.html" class="nav-link"><i data-lucide="crown"></i><span>Premium Requests</span></a>

            <div class="nav-label">Admin</div>
            <a href="announcements.html" class="nav-link"><i data-lucide="megaphone"></i><span>Announcements</span></a>
            <a href="user.html" class="nav-link"><i data-lucide="user-check"></i><span>User Approvals</span></a>
            <a href="customer-service.html" class="nav-link"><i data-lucide="message-circle"></i><span>Customer Service</span></a>

            <div class="nav-bottom">
                <a href="profile.html" class="nav-link"><i data-lucide="user-circle"></i><span>My Profile</span></a>
                <button class="nav-link logout" onclick="confirmLogout()"><i data-lucide="log-out"></i><span>Logout</span></button>
            </div>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <div class="topbar">
            <div style="flex:1;">
                <h1>Customer Service</h1>
                <p style="color:black; margin-top:2px;">Messages from users to AniMart</p>
            </div>
            <div class="topbar-stats">
                <div class="topbar-stat">
                    <div class="topbar-stat-val" id="stat-open">12</div>
                    <div class="topbar-stat-label">On-going</div>
                </div>
                <div class="topbar-stat">
                    <div class="topbar-stat-val" id="stat-pending">5</div>
                    <div class="topbar-stat-label">Pending</div>
                </div>
                <div class="topbar-stat">
                    <div class="topbar-stat-val" id="stat-resolved">48</div>
                    <div class="topbar-stat-label">Resolved</div>
                </div>
            </div>
        </div>

        <div class="cs-layout">

            <!-- CONVERSATION LIST -->
            <div class="conv-list">
                <div class="conv-search">
                    <div class="conv-search-wrap">
                        <i data-lucide="search" class="conv-search-icon"></i>
                        <input type="text" placeholder="Search conversations…" id="searchInput" oninput="filterConversations()">
                    </div>
                </div>

                <div class="conv-tabs">
                    <div class="conv-tab active" onclick="switchTab(this,'all')">All</div>
                    <div class="conv-tab" onclick="switchTab(this,'open')">On-going</div>
                    <div class="conv-tab" onclick="switchTab(this,'pending')">Pending</div>
                    <div class="conv-tab" onclick="switchTab(this,'closed')">Resolved</div>
                </div>

                <div class="conv-items" id="convItems"></div>
            </div>

            <!-- CHAT PANEL -->
            <div class="chat-panel" id="chatPanel">

                <!-- Header -->
                <div class="chat-header" id="chatHeader" style="display:none;">
                    <div class="conv-avatar" id="headerAvatar" style="width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:var(--mint);flex-shrink:0;"></div>
                    <div class="chat-header-info">
                        <div class="chat-header-name">
                            <span id="headerName">—</span>
                            <span class="online-dot" id="onlineDot" style="display:none;"></span>
                            <span id="headerTag"></span>
                        </div>
                        <div class="chat-header-sub" id="headerSub">—</div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="icon-btn" title="Mark resolved" onclick="markResolved()"><i data-lucide="check-circle"></i></button>
                        <button class="icon-btn" title="Refresh" onclick="loadConversations()"><i data-lucide="refresh-cw"></i></button>
                    </div>
                </div>

                <!-- Empty state -->
                <div class="empty-chat" id="emptyChat">
                    <i data-lucide="message-square-dashed"></i>
                    <p>Select a conversation to start replying</p>
                </div>

                <!-- Messages -->
                <div class="messages" id="messagesArea" style="display:none;"></div>

                <!-- Input -->
                <div class="chat-input-wrap" id="chatInputWrap" style="display:none;">
                    <div class="quick-replies" id="quickReplies"></div>
                    <div class="input-row">
                        <textarea class="chat-textarea" id="chatInput" placeholder="Type your reply…" rows="1" onkeydown="handleKey(event)"></textarea>
                        <button class="send-btn" onclick="sendMessage()"><i data-lucide="send"></i></button>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
// ─── DATA — live from the shared `support_messages` table ─
// Each conversation is one user's thread: every row with the same user_id.
// A row is an admin reply when admin_id is set (or sender = 'admin').
// See web/sql/support_messages_rls.sql.
let conversations = [];     // [{ id:<user uuid>, name, role, location, status, unread, lastMsg, lastTime, lastTs, messages:[{from,text,ts}] }]
let activeId   = null;       // user uuid of the open thread
let currentTab = 'all';
let adminId    = null;       // the signed-in admin's id (stamped on replies)
let adminPfp   = null;       // the signed-in admin's profile picture (for reply bubbles)
let realtimeChannel = null;  // live support_messages subscription
let reloadTimer = null;      // debounce for realtime-triggered reloads

// A support_messages row is from the admin side when an admin owns it.
function rowIsAdmin(r) {
    if (r.admin_id) return true;
    return String(r.sender || '').toLowerCase().trim() === 'admin';
}

const quickRepliesData = [
    "Salamat sa inyong mensahe!",
    "Inirepasar na namin ang inyong concern.",
    "Maaari po bang ibigay ang inyong order number?",
    "Ipapasa namin ito sa aming team.",
    "Naayos na po ba ang inyong issue?"
];

// ─── INIT ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    lucide.createIcons();
    renderQuickReplies();

    // Remember which admin we are, so replies can stamp admin_id + show our photo.
    const admin = await getAdminForCurrentUser();
    adminId = admin ? admin.id : null;
    if (adminId) {
        const { data: me } = await supabaseClient
            .from('admins').select('pfp').eq('id', adminId).maybeSingle();
        adminPfp = me ? me.pfp : null;
    }

    loadConversations();
    subscribeRealtime();

    // Auto-resize textarea
    const ta = document.getElementById('chatInput');
    ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
    });
});

// ─── FETCH + GROUP INTO THREADS ──────────────────────────
async function loadConversations() {
    const { data: msgs, error } = await supabaseClient
        .from('support_messages')
        .select('id, user_id, sender, admin_id, body, read, status, created_at')
        .order('created_at', { ascending: true });

    if (error) {
        console.error(error);
        document.getElementById('convItems').innerHTML =
            `<div style="padding:24px;text-align:center;color:var(--danger);font-size:0.78rem;">Couldn't load messages.<br>${escapeHtml(error.message)}</div>`;
        return;
    }

    const rows = (msgs || []).filter(m => m.user_id);   // every thread is keyed by user_id
    const userIds = [...new Set(rows.map(m => m.user_id))];

    const usersById = {};
    if (userIds.length) {
        const { data: users } = await supabaseClient
            .from('users').select('id, name, is_seller, address, avatar_url').in('id', userIds);
        (users || []).forEach(u => { usersById[u.id] = u; });
    }

    // Admin photos for the reply bubbles. RLS only returns the current admin's
    // own row, so other admins fall back to initials (still stamped with adminPfp).
    const adminsById = {};
    const adminIds = [...new Set(rows.map(m => m.admin_id).filter(Boolean))];
    if (adminIds.length) {
        const { data: admins } = await supabaseClient
            .from('admins').select('id, pfp').in('id', adminIds);
        (admins || []).forEach(a => { adminsById[a.id] = a; });
    }

    const threads = {};
    rows.forEach(m => { (threads[m.user_id] = threads[m.user_id] || []).push(m); });

    conversations = Object.keys(threads).map(uid => {
        const list   = threads[uid];
        const u      = usersById[uid] || {};
        const last   = list[list.length - 1];
        // Unread badge = the user's own messages the admin hasn't read yet.
        const unread = list.filter(r => !rowIsAdmin(r) && !r.read).length;
        // Stored state (DB `status`): 'closed' = resolved (set by the ✓ button),
        // otherwise 'open'. A new user message rows in as 'open' → re-opens.
        const isClosed = list.every(r => (r.status || 'open') === 'closed');
        const dbStatus = isClosed ? 'closed' : 'open';
        // Display status (drives tabs/pill/stats): Resolved, else Pending until
        // the admin has replied at least once, else Open.
        const hasAdminReply = list.some(rowIsAdmin);
        const status = isClosed ? 'closed' : (hasAdminReply ? 'open' : 'pending');
        return {
            id:       uid,
            name:     u.name || '(unknown user)',
            role:     u.is_seller ? 'Seller' : 'Buyer',
            location: u.address || '—',
            status,
            dbStatus,
            unread,
            avatar:   u.avatar_url || null,   // the user's photo (list + header)
            lastMsg:  last.body,
            lastTs:   last.created_at,
            lastTime: listTime(last.created_at),
            messages: list.map(r => ({
                from:   rowIsAdmin(r) ? 'admin' : 'user',
                text:   r.body,
                ts:     r.created_at,
                avatar: rowIsAdmin(r)
                            ? ((adminsById[r.admin_id] && adminsById[r.admin_id].pfp) || adminPfp || null)
                            : (u.avatar_url || null)
            }))
        };
    }).sort((a, b) => new Date(b.lastTs) - new Date(a.lastTs));

    updateStats();
    renderConversations();

    // Keep the open thread open (and refreshed) across reloads.
    if (activeId && conversations.some(c => c.id === activeId)) openConversation(activeId);
    else if (activeId) resetChatPanel();
}

// ─── REALTIME ────────────────────────────────────────────
// Live-update the inbox whenever support_messages changes (a new user message
// from the mobile app, a read flag, a resolve). RLS applies to the stream, so we
// only receive rows this admin may read. Debounced so a burst — or our own reply
// echoing back — collapses into a single reload.
function subscribeRealtime() {
    if (realtimeChannel) return;
    realtimeChannel = supabaseClient
        .channel('support_messages_admin')
        .on('postgres_changes',
            { event: '*', schema: 'public', table: 'support_messages' },
            scheduleReload)
        .subscribe();
}

function scheduleReload() {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(loadConversations, 250);
}

// Mark this user's unread messages as read (the unread badge), without touching
// `status` so the thread stays Open. Fire-and-forget; logs but doesn't block UI.
async function markThreadRead(userId) {
    const { error } = await supabaseClient
        .from('support_messages')
        .update({ read: true })
        .eq('user_id', userId)
        .is('admin_id', null)
        .eq('read', false);
    if (error) console.error('markThreadRead:', error);
}

function updateStats() {
    const by = s => conversations.filter(c => c.status === s).length;
    document.getElementById('stat-open').textContent     = by('open');
    document.getElementById('stat-pending').textContent  = by('pending');
    document.getElementById('stat-resolved').textContent = by('closed');
}

// ─── TIME / HTML HELPERS ─────────────────────────────────
function formatClock(ts) {
    return new Date(ts).toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
}
function dayLabel(ts) {
    const d = new Date(ts), now = new Date();
    const same = (a, b) => a.toDateString() === b.toDateString();
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    if (same(d, now))  return 'Today';
    if (same(d, yest)) return 'Yesterday';
    return d.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
}
// Compact stamp for the conversation list: clock if today, otherwise the day.
function listTime(ts) {
    const lbl = dayLabel(ts);
    return lbl === 'Today' ? formatClock(ts) : lbl;
}
function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Avatar contents: the initials always render underneath; if a photo URL is given
// it overlays them, and removes itself on a load error so the initials show.
function avatarMarkup(url, initials) {
    const text = escapeHtml(initials);
    if (!url) return text;
    return `${text}<img class="av-img" src="${escapeHtml(url)}" alt="" onerror="this.remove()">`;
}

function resetChatPanel() {
    activeId = null;
    document.getElementById('emptyChat').style.display    = 'flex';
    document.getElementById('chatHeader').style.display   = 'none';
    document.getElementById('messagesArea').style.display = 'none';
    document.getElementById('chatInputWrap').style.display = 'none';
}

// ─── RENDER CONVERSATIONS ────────────────────────────────
function renderConversations() {
    const container = document.getElementById('convItems');
    const search = document.getElementById('searchInput').value.toLowerCase();

    const filtered = conversations.filter(c => {
        const matchTab = currentTab === 'all' || c.status === currentTab;
        const matchSearch = c.name.toLowerCase().includes(search) || (c.lastMsg || '').toLowerCase().includes(search);
        return matchTab && matchSearch;
    });

    container.innerHTML = '';

    if (filtered.length === 0) {
        container.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:0.8rem;">No conversations found</div>`;
        return;
    }

    filtered.forEach(c => {
        const initials = c.name.split(' ').map(n => n[0]).join('').slice(0, 2);
        const dotColor = { open: '#7EFFC5', pending: '#FBB824', closed: 'var(--muted)' }[c.status] || 'var(--muted)';

        const div = document.createElement('div');
        div.className = 'conv-item' + (activeId === c.id ? ' active' : '');
        div.dataset.id = c.id;
        div.onclick = () => openConversation(c.id);
        div.innerHTML = `
            <div class="conv-avatar">${avatarMarkup(c.avatar, initials)}</div>
            <div class="conv-meta">
                <div class="conv-name">
                    <span>${escapeHtml(c.name)}</span>
                    <span class="conv-time">${escapeHtml(c.lastTime)}</span>
                </div>
                <div class="conv-preview">${escapeHtml(c.lastMsg || '')}</div>
            </div>
            ${c.unread > 0 ? `<div class="conv-unread">${c.unread}</div>` : `<div class="priority-dot" style="background:${dotColor};"></div>`}
        `;
        container.appendChild(div);
    });

    lucide.createIcons();
}

// ─── OPEN CONVERSATION ───────────────────────────────────
async function openConversation(id) {
    activeId = id;
    const conv = conversations.find(c => c.id === id);
    if (!conv) return;

    // Reading the thread clears its unread badge: mark the user's unread
    // messages as read in the DB (status is untouched, so it stays Open). The
    // badge only comes back when the user sends a new (unread) message.
    if (conv.unread > 0) {
        conv.unread = 0;
        renderConversations();   // swap the "2" badge for the status dot
        markThreadRead(id);
    }

    // Update active state
    document.querySelectorAll('.conv-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
    });

    // Update header
    const initials = conv.name.split(' ').map(n => n[0]).join('').slice(0, 2);
    document.getElementById('headerAvatar').innerHTML = avatarMarkup(conv.avatar, initials);
    document.getElementById('headerName').textContent = conv.name;
    document.getElementById('onlineDot').style.display = 'none';   // no presence signal in the data
    document.getElementById('headerSub').textContent = `${conv.role} · ${conv.location}`;

    const tagMap = {
        open:    '<span class="tag tag-open">On-going</span>',
        pending: '<span class="tag tag-pending">Pending</span>',
        closed:  '<span class="tag tag-closed">Resolved</span>'
    };
    document.getElementById('headerTag').innerHTML = tagMap[conv.status] || '';

    // Show panels
    document.getElementById('emptyChat').style.display = 'none';
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('messagesArea').style.display = 'flex';
    document.getElementById('chatInputWrap').style.display = 'block';

    // Render messages
    renderMessages(conv);
    lucide.createIcons();
}

// ─── RENDER MESSAGES ────────────────────────────────────
function renderMessages(conv) {
    const area = document.getElementById('messagesArea');
    area.innerHTML = '';

    let lastDate = '';

    conv.messages.forEach((msg, i) => {
        const label = dayLabel(msg.ts);

        if (label !== lastDate) {
            const divider = document.createElement('div');
            divider.className = 'date-divider';
            divider.textContent = label;
            area.appendChild(divider);
            lastDate = label;
        }

        const isAdmin = msg.from === 'admin';
        const initials = isAdmin ? 'AD' : conv.name.split(' ').map(n => n[0]).join('').slice(0, 2);

        const row = document.createElement('div');
        row.className = 'msg-row' + (isAdmin ? ' admin' : '');
        row.style.animation = 'fadeIn 0.25s ease both';
        row.style.animationDelay = (i * 0.04) + 's';

        row.innerHTML = `
            <div class="msg-avatar ${isAdmin ? 'admin-av' : 'user-av'}">${avatarMarkup(msg.avatar, initials)}</div>
            <div class="msg-content">
                <div class="msg-bubble">${escapeHtml(msg.text)}</div>
                <div class="msg-time">${formatClock(msg.ts)}</div>
            </div>
        `;
        area.appendChild(row);
    });

    // Scroll to bottom
    area.scrollTop = area.scrollHeight;
}

// ─── QUICK REPLIES ───────────────────────────────────────
function renderQuickReplies() {
    const wrap = document.getElementById('quickReplies');
    quickRepliesData.forEach(r => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn';
        btn.textContent = r;
        btn.onclick = () => {
            document.getElementById('chatInput').value = r;
            document.getElementById('chatInput').focus();
        };
        wrap.appendChild(btn);
    });
}

// ─── SEND MESSAGE ────────────────────────────────────────
// An admin reply is a support_messages row for this user_id with sender 'admin'
// and admin_id stamped to the signed-in admin.
async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !activeId) return;

    const sendBtn = document.querySelector('.send-btn');
    input.disabled = true; if (sendBtn) sendBtn.disabled = true;

    // Persist the thread's real open/closed state on the reply (never the derived
    // 'pending'): answering a pending/open thread leaves it open, a resolved one
    // stays resolved until the user writes back.
    const conv = conversations.find(c => c.id === activeId);
    const status = conv ? conv.dbStatus : 'open';

    const { error } = await supabaseClient
        .from('support_messages')
        .insert({ user_id: activeId, sender: 'admin', admin_id: adminId, body: text, read: false, status });

    input.disabled = false; if (sendBtn) sendBtn.disabled = false;

    if (error) { console.error(error); alert('Could not send: ' + error.message); return; }

    input.value = '';
    input.style.height = 'auto';
    await loadConversations();   // re-fetch so the new bubble + list order reflect the DB
    input.focus();
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

// ─── TABS ────────────────────────────────────────────────
function switchTab(el, tab) {
    currentTab = tab;
    document.querySelectorAll('.conv-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    resetChatPanel();      // close the open thread, back to the empty state
    renderConversations();
}

// ─── SEARCH ─────────────────────────────────────────────
function filterConversations() {
    renderConversations();
}

// ─── ACTIONS ─────────────────────────────────────────────
// Resolving a thread marks the user's outstanding messages as read; with no
// status column, "all read" is what makes a conversation count as Resolved.
// A new incoming user message (read = false) reopens it automatically.
async function markResolved() {
    if (!activeId) return;
    // Resolve the whole thread: close every row and clear any unread.
    const { error } = await supabaseClient
        .from('support_messages')
        .update({ status: 'closed', read: true })
        .eq('user_id', activeId);

    if (error) { console.error(error); alert('Could not update: ' + error.message); return; }
    await loadConversations();
}
